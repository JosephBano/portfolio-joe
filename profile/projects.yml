- id: hato-erp
  name: HATO — ERP de gestión ganadera
  description:
    es: Sistema de gestión integral para una hacienda ganadera en Ecuador, construido sobre un registro
      inmutable de eventos fechados, con panel administrativo web y aplicación de campo que opera sin
      conexión.
    en: Comprehensive management system for a cattle farm in Ecuador, built on an immutable log of dated
      events, with a web admin panel and an offline-capable field application.
  url: https://github.com/JosephBano/erp-hacienda
  evidence:
  - erp-hacienda
  bullets:
  - id: proj-hato-001
    tags:
    - csharp
    - modular-monolith
    - event-driven
    - postgresql
    - entity-framework
    weight: 5
    es: Diseñó la arquitectura de un monolito modular en .NET 8 con seis módulos de dominio sobre un modelo
      de eventos inmutables, con persistencia en PostgreSQL y 54 migraciones versionadas.
    en: Architected a .NET 8 modular monolith with six domain modules over an immutable event model, backed
      by PostgreSQL with 54 versioned migrations.
  - id: proj-hato-002
    tags:
    - testing
    - xunit
    - testcontainers
    - postgresql
    weight: 5
    es: 'Definió la estrategia de pruebas del sistema: 569 pruebas con xUnit y Testcontainers, ejecutando
      la integración contra una instancia real de PostgreSQL en contenedor.'
    en: 'Defined the system test strategy: 569 tests using xUnit and Testcontainers, running integration
      against a real containerized PostgreSQL instance.'
  - id: proj-hato-003
    tags:
    - angular
    - react-native
    - offline-first
    - typescript
    weight: 5
    es: 'Dirigió el desarrollo de dos clientes: panel administrativo en Angular 21 y aplicación de campo
      offline-first en React Native y Expo con WatermelonDB y resolución de sincronización.'
    en: 'Led development of two clients: an Angular 21 admin panel and an offline-first field application
      in React Native and Expo using WatermelonDB with sync conflict resolution.'
  - id: proj-hato-004
    tags:
    - ci-cd
    - codeql
    - docker
    - linux
    weight: 4
    es: 'Montó la infraestructura de entrega: integración continua con análisis estático CodeQL, despliegues
      a entornos de staging y producción, Caddy como proxy inverso y renovación automatizada de certificados
      TLS mediante systemd.'
    en: 'Built the delivery infrastructure: continuous integration with CodeQL static analysis, staging
      and production deployments, Caddy reverse proxy, and automated TLS certificate renewal via systemd.'
