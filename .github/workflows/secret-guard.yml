name: secret-guard

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  path-guard:
    name: path-guard (RF-SEG-004)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for restricted paths in PR/push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              CHANGED_FILES=$(git ls-files)
            fi
          fi

          echo "Inspeccionando archivos modificados:"
          echo "$CHANGED_FILES"

          FAILED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" =~ ^privado/ ]] || [[ "$file" == ".secrets" ]] || ([[ "$file" =~ ^\.secrets\. ]] && [[ "$file" != ".secrets.example" ]]); then
              echo "::error file=$file::Ruta prohibida detectada en el repositorio: '$file' (RF-SEG-004)."
              FAILED=1
            fi
          done <<< "$CHANGED_FILES"

          if [ $FAILED -ne 0 ]; then
            echo "ERROR: Se encontraron rutas de privado/ o .secrets. Mezcla rechazada."
            exit 1
          fi

  pii-scan:
    name: pii-scan (RF-SEG-005)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff against .security/patterns.txt
        run: |
          if [ ! -f .security/patterns.txt ]; then
            echo "::error::No se encontró .security/patterns.txt."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            DIFF_OUTPUT=$(git diff -U0 "$BASE_REF"...HEAD -- . ':!.security/patterns.txt')
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              DIFF_OUTPUT=$(git diff -U0 HEAD~1 HEAD -- . ':!.security/patterns.txt')
            else
              DIFF_OUTPUT=$(git diff -U0 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- . ':!.security/patterns.txt')
            fi
          fi

          ADDED_LINES=$(echo "$DIFF_OUTPUT" | grep '^[+]' | grep -v '^[+][+][+]' | sed 's/^[+]//' || true)

          if [ -n "$ADDED_LINES" ]; then
            MATCHES=$(echo "$ADDED_LINES" | grep -E -f .security/patterns.txt || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Se detectaron posibles datos sensibles en el diff (RF-SEG-005):"
              echo "$MATCHES" | head -n 10
              exit 1
            fi
          fi
          echo "Escaneo de PII completado sin hallazgos."

  commit-hygiene:
    name: commit-hygiene (RF-SEG-007)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no AI co-authorship in commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%H %B" "origin/${{ github.base_ref }}"...HEAD)
          else
            COMMITS=$(git log -n 10 --format="%H %B")
          fi

          SUSPECTS=$(echo "$COMMITS" | grep -Ei "co-authored-by:.*(agent|bot|claude|gemini|copilot|assistant|ai|antigravity)" || true)

          if [ -n "$SUSPECTS" ]; then
            echo "::error::Se detectó atribución de co-autoría a agente en los commits (RF-SEG-007):"
            echo "$SUSPECTS"
            exit 1
          fi
          echo "Higiene de commits validada exitosamente."

  gitleaks:
    name: gitleaks (RF-SEG-005)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_IGNORE_PATH: .gitleaksignore

  secret-guard:
    name: secret-guard
    needs: [path-guard, pii-scan, commit-hygiene, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Secret Guard Status Check
        run: echo "Todos los controles de seguridad pasaron satisfactoriamente."
